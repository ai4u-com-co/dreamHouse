name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  # Un push nuevo a un PR cancela la corrida anterior (ahorra minutos de Actions).
  # En push a la rama default NO se cancela: cada merge conserva su CI.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_VERCEL_ENV: production
          # Se pueden agregar variables de entorno falsas para el build si es necesario
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
